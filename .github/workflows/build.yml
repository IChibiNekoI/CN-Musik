name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Signaturschluessel bereitstellen
        run: |
          if [ ! -f keystore.b64 ]; then
            keytool -genkeypair -keystore ks.jks -storepass musikpass -keypass musikpass -alias musik -keyalg RSA -keysize 2048 -validity 36500 -dname "CN=Musik"
            base64 -w0 ks.jks > keystore.b64
            git config user.name "github-actions"
            git config user.email "actions@github.com"
            git add keystore.b64
            git commit -m "Add signing key"
            git push
          fi
          base64 -d keystore.b64 > "$GITHUB_WORKSPACE/musik.jks"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - run: gradle assembleDebug
      - name: APK umbenennen (Name + Version)
        id: apk
        run: |
          VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          NAME="Musik $VERSION"
          cp app/build/outputs/apk/debug/app-debug.apk "app/build/outputs/apk/debug/$NAME.apk"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: app/build/outputs/apk/debug/${{ steps.apk.outputs.name }}.apk
