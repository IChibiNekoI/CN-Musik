name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Signaturschluessel bereitstellen
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$GITHUB_WORKSPACE/musik.jks"
            echo "MUSIK_STORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "MUSIK_KEY_ALIAS=${KEY_ALIAS:-musik}" >> "$GITHUB_ENV"
            echo "MUSIK_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
          else
            echo "::warning::Kein Secret KEYSTORE_B64 gesetzt. Es wird ein Schluessel nur fuer diesen Build erzeugt, die APK laesst sich dann nicht ueber eine fruehere Version aktualisieren."
            PW=$(openssl rand -hex 16)
            keytool -genkeypair -keystore "$GITHUB_WORKSPACE/musik.jks" -storepass "$PW" -keypass "$PW" -alias musik -keyalg RSA -keysize 2048 -validity 36500 -dname "CN=Musik"
            echo "MUSIK_STORE_PASSWORD=$PW" >> "$GITHUB_ENV"
            echo "MUSIK_KEY_ALIAS=musik" >> "$GITHUB_ENV"
            echo "MUSIK_KEY_PASSWORD=$PW" >> "$GITHUB_ENV"
          fi
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: 8.9
      - run: gradle assembleRelease assembleDebug
      - name: APK umbenennen (Name + Version)
        id: apk
        run: |
          VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          NAME="Musik $VERSION"
          mkdir -p out
          # Hauptversion: Release (schnell). Zusätzlich die Debug-Version als Notnagel.
          cp app/build/outputs/apk/release/app-release.apk "out/$NAME.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "out/$NAME debug.apk"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.apk.outputs.name }}
          path: out/${{ steps.apk.outputs.name }}.apk
      - uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.apk.outputs.name }} debug
          path: out/${{ steps.apk.outputs.name }} debug.apk
      - name: Release mit APK veroeffentlichen (nur bei Tags wie v1.0.0)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/${{ steps.apk.outputs.name }}.apk
          generate_release_notes: true
